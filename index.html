<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer 接線中</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="login-page">
        <section class="login-box">

            <h1>Transfer</h1>
            <h2>接線中</h2>

            <div class="avatar"></div>

            <div class="role-switcher">
                <button class="arrow-button" type="button">◀</button>

                <span class="role-name">照顧者</span>

                <button class="arrow-button" type="button">▶</button>
            </div>

            <input
                id="passwordInput"
                class="password-input"
                type="password"
                placeholder="請輸入密碼"
            >

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
